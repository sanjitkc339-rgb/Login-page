<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Keep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M14 2C8.5 2 4 6.5 4 12v3c-1.1 0-2 .9-2 2v7c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2v-7c0-1.1-.9-2-2-2v-3c0-5.5-4.5-10-10-10zm0 3c3.9 0 7 3.1 7 7v3H7v-3c0-3.9 3.1-7 7-7z" fill="currentColor"/>
      </svg>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to keep going where you left off.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <span class="error" id="email-error"></span>
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">Password</label>
          <a href="#" class="link-small">Forgot?</a>
        </div>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <span class="error" id="password-error"></span>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="remember" name="remember">
        <span>Stay signed in</span>
      </label>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p class="footer-text">No account? <a href="#" class="link-small">Create one</a></p>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      let valid = true;

      if (!email.value.includes('@')) {
        email.classList.add('invalid');
        emailError.textContent = 'Enter a valid email address.';
        valid = false;
      } else {
        email.classList.remove('invalid');
        emailError.textContent = '';
      }

      if (password.value.length < 6) {
        password.classList.add('invalid');
        passwordError.textContent = 'Password must be at least 6 characters.';
        valid = false;
      } else {
        password.classList.remove('invalid');
        passwordError.textContent = '';
      }

      if (valid) {
        alert('Signed in! (This is a demo form — connect it to your backend to make it work.)');
        form.reset();
      }
    });
  </script>
</body>
</html>
